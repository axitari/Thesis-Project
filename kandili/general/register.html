<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kandili - Educator Registration</title>
    <link rel="stylesheet" href="../../static/css/style.css">
    <link rel="stylesheet" href="../../static/css/register-style.css">
</head>
<body class="auth-body">

   <div class="auth-card register-card">
        
        <div class="auth-header">
            <h2>Kandili Registration</h2>
            <p>Official DepEd Workload & Wellness Portal</p>
        </div>
        
        <form id="registerForm">
            
            <!-- Personal Info Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
            </div>

            <!-- Account Credentials -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="juan.delacruz@deped.gov.ph" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <!-- Teacher Employment Details -->
            <div class="form-row">
                <div class="form-group">
                    <label for="depedEmployeeId">DepEd Employee ID</label>
                    <input type="text" id="depedEmployeeId" placeholder="e.g. 123456" required>
                </div>
                <div class="form-group">
                    <label for="plantillaItemNo">Plantilla Item No.</label>
                    <input type="text" id="plantillaItemNo" placeholder="e.g. T-2024-001" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="prcLicenseNo">PRC License No.</label>
                    <input type="text" id="prcLicenseNo" placeholder="e.g. 1234567" required>
                </div>
                <div class="form-group">
                    <label for="employmentStatus">Employment Status</label>
                    <input type="text" id="employmentStatus" placeholder="e.g. Permanent" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="yearsInService">Years in Service</label>
                    <input type="number" id="yearsInService" min="0" placeholder="0" required>
                </div>
                <div class="form-group">
                    <label for="contactNumber">Contact Number</label>
                    <input type="tel" id="contactNumber" placeholder="+63 912 345 6789" required>
                </div>
            </div>

            <!-- Assignment Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="division">DepEd Division</label>
                    <select id="division" required>
                        <option value="" disabled selected>Select Division...</option>
                        <option value="Iloilo City">Division of Iloilo City</option>
                        <option value="Iloilo Province">Division of Iloilo Province</option>
                        <option value="Guimaras">Division of Guimaras</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="school">Assigned School</label>
                    <select id="school" required>
                        <option value="" disabled selected>Select School...</option>
                        <option value="WVSU ILS">Raul O.V. Causing Memorial School</option>
                        <option value="ICNHS">Lopez Jaena Elementary School</option>
                        <option value="SPED">San Miguel Elementary School</option>
                        <option value="Other">Other / Not Listed</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="department">Department / Subject</label>
                    <input type="text" id="department" placeholder="e.g. Math Department" required>
                </div>
                <div class="form-group">
                    <label for="advisoryClass">Advisory Class</label>
                    <input type="text" id="advisoryClass" placeholder="e.g. Grade 6 - Diamond" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="educationalAttainment">Highest Educational Attainment</label>
                    <input type="text" id="educationalAttainment" placeholder="e.g. Bachelor of Secondary Education" required>
                </div>
                <div class="form-group">
                    <label for="teachingLevel">Teaching Level</label>
                    <select id="teachingLevel" required>
                        <option value="Primary">Primary (Grades 1-3) - Self-Contained</option>
                        <option value="Intermediate">Intermediate (Grades 4-6) - Departmentalized</option>
                    </select>
                </div>
            </div>

            <!-- System Role -->
            <div class="form-row">
                <div class="form-group">
                    <label for="role">System Role</label>
                    <select id="role">
                        <option value="Teacher">Teacher</option>
                        <option value="Principal">Principal / School Head</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assignedInstitution">Assigned Institution</label>
                    <input type="text" id="assignedInstitution" placeholder="e.g. Raul O.V. Causing Memorial School" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Create Educator Profile</button>

            <div class="footer-text" style="margin-top: 1rem;">
                <p>By creating an account, you agree to our <a href="privacy-policy.html">Privacy Policy & Terms</a>.</p>
            </div>
            
        </form>

        <div class="footer-text">
            <p>Already have an account? <a href="login.html">Log in here.</a></p>
        </div>
        
    </div>
<!-- 1. Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Load connection script -->
        <script src="../../static/js/supabaseClient.js"></script>

    <!-- 3. Load registration logic -->
        <script src="../../static/js/registerLogic.js"></script>
</body>
</html>
